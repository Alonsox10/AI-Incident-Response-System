services:
  postgres:
    image: postgres:16
    container_name: incident_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alonso
      POSTGRES_DB: incident_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incident_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: incident_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobreescribe la URL de .env para usar el hostname del servicio de Docker
      POSTGRES_URL: postgresql://postgres:alonso@postgres:5432/incident_ai
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
